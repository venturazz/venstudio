name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: venstudio
          POSTGRES_PASSWORD: venstudio
          POSTGRES_DB: venstudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venstudio" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://venstudio:venstudio@localhost:5432/venstudio
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Upload lockfile (first run)
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Install ffmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Skip slow man-db triggers; fall back to a static build if apt is stuck.
          echo 'path-exclude /usr/share/man/*' | sudo tee /etc/dpkg/dpkg.cfg.d/01_noman >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          if ! timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg'; then
            curl -fsSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Vendored style packs match styles/lock.json and validate
        run: |
          node scripts/sync-styles.mjs --check
          node --test "styles/tools/*.test.mjs"

      - name: Unit tests (crypto)
        run: npm run test:unit

      - name: Worker tests
        run: npm run test:worker

      - name: Typecheck worker
        run: npm run typecheck:worker

      - name: Typecheck portal
        run: npm run typecheck -w apps/portal

      - name: Build portal
        run: npm run build

      - name: End-to-end (portal + Postgres + worker)
        run: bash scripts/e2e.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # After Playwright: its --with-deps installed the system libraries Remotion's headless Chromium needs too.
      # The project is assembled exactly as the portal serves it to workers: the runtime plus the vendored packs'
      # render projects (the flat-vector-explainer composition loads from styles/packs/explainer-flat-vector/render).
      - name: Remotion renderer and html-capture (assemble from the vendored packs, install, typecheck, probe, render the golden fixture and every html-capture pack)
        timeout-minutes: 35
        env:
          VENSTUDIO_REMOTION_DIR: ${{ github.workspace }}/.e2e-remotion-project
          VENSTUDIO_REMOTION_OUT: ${{ github.workspace }}/.e2e-remotion
          VENSTUDIO_REMOTION_REQUIRED: "1"
        run: |
          node scripts/remotion-project.mjs "$VENSTUDIO_REMOTION_DIR"
          cd "$VENSTUDIO_REMOTION_DIR"
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json
          npx remotion browser ensure
          node scripts/probe.mjs --full
          node scripts/probe.mjs
          cd "$GITHUB_WORKSPACE"
          node --test apps/worker/remotion-render.test.ts
          # html-capture (worker 0.10.0): the probe, every vendored html-capture pack through the real render-video
          # path (size, duration, frame count, the shared mix and caption burn, qc-video's sampled frames), and pages
          # that try the network, which must fail. Then each pack's fixture as the styles repo's CI renders it.
          node --test apps/worker/html-capture-render.test.ts
          mkdir -p "$VENSTUDIO_REMOTION_OUT"
          for id in $(node -e 'for (const p of JSON.parse(require("fs").readFileSync("styles/lock.json","utf8")).packs) if (p.engine === "html-capture") console.log(p.id)'); do
            node apps/worker/venstudio-worker.ts capture-html --pack "styles/packs/$id" --out "$VENSTUDIO_REMOTION_OUT/$id-fixture.mp4" --remotion "$VENSTUDIO_REMOTION_DIR" --font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            node styles/tools/check-video.mjs "$VENSTUDIO_REMOTION_OUT/$id-fixture.mp4" "styles/packs/$id/fixtures/expect.json"
          done

      - name: Browser end-to-end (UI flows + screenshots)
        env:
          UI_DB: postgres://venstudio:venstudio@localhost:5432/venstudio_ui
        run: |
          psql "$DATABASE_URL" -qc "CREATE DATABASE venstudio_ui"
          export APP_URL=http://localhost:3200 SETUP_TOKEN=ui-setup-token
          export ENCRYPTION_KEY="$(openssl rand -base64 32)" WORKER_DIR="$PWD/apps/worker" ARTIFACT_DIR="$PWD/.e2e-ui-data"
          # Fake 9router started by scripts/ui-e2e.mjs. It hangs at first, like an unreachable 9router, so pages must not
          # wait for it, then it answers. The /v1 suffix also exercises the base URL handling.
          export NINEROUTER_BASE_URL=http://127.0.0.1:3297/v1
          # The fake 9router answers 401 to any request without this key, so the Bearer header is checked on every call.
          export NINEROUTER_API_KEY=test-router-key
          # Fake Hermes started by scripts/ui-e2e.mjs.
          export HERMES_BASE_URL=http://127.0.0.1:3299 HERMES_API_KEY=test-hermes-key HERMES_IMAGE_PROVIDER_ORDER=cloudflare,agnes,canva
          DATABASE_URL="$UI_DB" node apps/portal/scripts/migrate.mjs
          # The Template Lab must never fetch a study's links itself (Hermes looks at them): any request from the portal
          # process to YouTube or GitHub is written to the canary file and fails; ui-e2e.mjs asserts it stays empty.
          export E2E_FETCH_CANARY="$PWD/.e2e-ui-canary.log"
          rm -f "$E2E_FETCH_CANARY"
          (cd apps/portal && DATABASE_URL="$UI_DB" NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/e2e-fetch-canary.mjs" npx next start -p 3200 > ../../ui-portal.log 2>&1) &
          for i in $(seq 1 60); do curl -fsS $APP_URL/api/health >/dev/null 2>&1 && break; sleep 1; done
          node scripts/ui-e2e.mjs || { tail -n 80 ui-portal.log; exit 1; }

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: .e2e-ui/screenshots
          if-no-files-found: ignore

      - name: Upload the Remotion fixture render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-fixture-render
          path: .e2e-remotion
          if-no-files-found: ignore

      - name: Shell syntax
        run: bash -n apps/worker/install.sh && bash -n scripts/e2e.sh && node --check apps/render-remotion/scripts/probe.mjs && node --check scripts/e2e-update-proxy.mjs && node --check scripts/sync-styles.mjs && node --check scripts/remotion-project.mjs && node --check styles/tools/check-video.mjs && node --check styles/packs/probe-line-graph/render/graph.js

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/portal/Dockerfile -t venstudio-portal:ci .
      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: ci
          APP_URL: https://studio.example.com
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SETUP_TOKEN: abcdef
          DOMAIN: studio.example.com
        run: |
          docker network create coolify >/dev/null 2>&1 || true
          docker compose -f docker-compose.coolify.yml config -q
          docker compose -f deploy/docker-compose.yml config -q
      - name: Coolify stack starts and serves /setup
        env:
          POSTGRES_PASSWORD: cipassword
          APP_URL: https://studio.example.com
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SETUP_TOKEN: abcdef
        run: |
          cat > /tmp/ports.yml <<'YML'
          services:
            portal:
              ports: ["3000:3000"]
          YML
          docker network create coolify >/dev/null 2>&1 || true
          docker compose -f docker-compose.coolify.yml -f /tmp/ports.yml up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health || { docker compose -f docker-compose.coolify.yml logs --tail 60; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup)" = 200
          curl -fsS http://localhost:3000/install/SETUP.md | grep -q "https://studio.example.com/install/install.sh"
          # The image carries the Remotion templates, so Muse workers can install remotion-2d from the portal.
          # Downloaded first, then searched: grep -q closing a pipe early must not fail curl.
          curl -fsS http://localhost:3000/install/render-remotion.json -o /tmp/render-remotion.json
          grep -q '"src/packs/explainer-flat-vector/FlatVectorExplainer.tsx"' /tmp/render-remotion.json
          # The image carries the vendored style packs: their index is served for workers.
          curl -fsS http://localhost:3000/install/style-packs.json -o /tmp/style-packs.json
          grep -q '"explainer-flat-vector"' /tmp/style-packs.json
          # Another app on the shared coolify network (stands in for Hermes) must be reachable by container name.
          docker run -d --rm --name fake-hermes-abc --network coolify nginx:alpine >/dev/null
          sleep 2
          PORTAL=$(docker compose -f docker-compose.coolify.yml ps -q portal)
          docker exec "$PORTAL" node -e "fetch('http://fake-hermes-abc/').then(r=>{console.log('reach', r.status); process.exit(r.ok?0:1)}).catch(e=>{console.log('FAIL', e.cause?.code||e.message); process.exit(1)})"
          docker rm -f fake-hermes-abc >/dev/null
          docker compose -f docker-compose.coolify.yml logs portal | tail -20
          docker compose -f docker-compose.coolify.yml down -v
      - name: Media host serves only the four prefixes, read-only, as the Hermes user
        run: |
          # A fake Hermes data directory owned by uid 10000, with a decoy token next to the published dirs.
          D=$(mktemp -d)
          mkdir -p "$D/cache/generated/images" "$D/cache/tts" "$D/cache/audio" "$D/cache/generated/videos" "$D/cache/canva_tokens"
          printf 'PNGDATA' > "$D/cache/generated/images/a.png"
          printf 'MP3DATA' > "$D/cache/tts/v.mp3"
          printf 'WAVDATA' > "$D/cache/audio/m.wav"
          printf 'MP4DATA' > "$D/cache/generated/videos/c.mp4"
          printf 'SECRET' > "$D/cache/canva_tokens/canva_token_0.json"
          sudo chown -R 10000:10000 "$D"
          # Same setup the owner does once on the VPS: the fixed path is a symlink to the Hermes data dir.
          sudo mkdir -p /data/venstudio && sudo ln -sfn "$D" /data/venstudio/hermes-data
          docker network create coolify >/dev/null 2>&1 || true
          # Coolify refuses ${...} and shell characters in volume paths; fail here instead of in Coolify.
          bash scripts/check-coolify-compose.sh deploy/hermes-files.coolify.yml docker-compose.coolify.yml
          docker compose -f deploy/hermes-files.coolify.yml config -q
          docker compose -f deploy/hermes-files.coolify.yml up -d --build
          code() { docker run --rm --network coolify curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in $(seq 1 30); do [ "$(code http://hermes-files:8000/healthz)" = 200 ] && break; sleep 1; done
          fail() { echo "MEDIA FAIL: $*"; docker logs hermes-files 2>&1 | tail -30; exit 1; }
          [ "$(code http://hermes-files:8000/healthz)" = 200 ] || fail "healthz"
          for p in img/a.png tts/v.mp3 audio/m.wav clip/c.mp4; do [ "$(code http://hermes-files:8000/$p)" = 200 ] || fail "/$p not served"; done
          [ "$(docker run --rm --network coolify curlimages/curl:8.11.1 -s http://hermes-files:8000/clip/c.mp4)" = MP4DATA ] || fail "clip bytes differ"
          [ "$(code http://hermes-files:8000/)" = 404 ] || fail "/ is not 404"
          [ "$(code http://hermes-files:8000/canva_tokens/canva_token_0.json)" = 404 ] || fail "canva token reachable"
          [ "$(code --path-as-is http://hermes-files:8000/img/../canva_tokens/canva_token_0.json)" = 404 ] || fail "traversal reachable"
          [ "$(code http://hermes-files:8000/img/)" = 404 ] || [ "$(code http://hermes-files:8000/img/)" = 403 ] || fail "directory listing"
          [ "$(code -X POST http://hermes-files:8000/img/a.png)" = 405 ] || fail "POST accepted"
          [ "$(docker inspect -f '{{.Config.User}}' hermes-files)" = "10000:10000" ] || fail "not running as the Hermes user"
          echo "media host ok"
          docker compose -f deploy/hermes-files.coolify.yml down
          # The checker must catch the form Coolify rejected, or it proves nothing.
          printf 'services:\n  x:\n    image: nginx\n    volumes:\n      - ${HERMES_DATA_DIR:?set it}:/srv:ro\n' > /tmp/bad.yml
          if bash scripts/check-coolify-compose.sh /tmp/bad.yml; then echo "checker missed a \${...} volume"; exit 1; fi
