name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: venstudio
          POSTGRES_PASSWORD: venstudio
          POSTGRES_DB: venstudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venstudio" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://venstudio:venstudio@localhost:5432/venstudio
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Upload lockfile (first run)
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Install ffmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Skip slow man-db triggers; fall back to a static build if apt is stuck.
          echo 'path-exclude /usr/share/man/*' | sudo tee /etc/dpkg/dpkg.cfg.d/01_noman >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          if ! timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg'; then
            curl -fsSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Unit tests (crypto)
        run: npm run test:unit

      - name: Worker tests
        run: npm run test:worker

      - name: Typecheck worker
        run: npm run typecheck:worker

      - name: Typecheck portal
        run: npm run typecheck -w apps/portal

      - name: Build portal
        run: npm run build

      - name: End-to-end (portal + Postgres + worker)
        run: bash scripts/e2e.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end (UI flows + screenshots)
        env:
          UI_DB: postgres://venstudio:venstudio@localhost:5432/venstudio_ui
        run: |
          psql "$DATABASE_URL" -qc "CREATE DATABASE venstudio_ui"
          export APP_URL=http://localhost:3200 SETUP_TOKEN=ui-setup-token
          export ENCRYPTION_KEY="$(openssl rand -base64 32)" WORKER_DIR="$PWD/apps/worker" ARTIFACT_DIR="$PWD/.e2e-ui-data"
          # Fake 9router started by scripts/ui-e2e.mjs. It hangs at first, like an unreachable 9router, so pages must not
          # wait for it, then it answers. The /v1 suffix also exercises the base URL handling.
          export NINEROUTER_BASE_URL=http://127.0.0.1:3297/v1
          # The fake 9router answers 401 to any request without this key, so the Bearer header is checked on every call.
          export NINEROUTER_API_KEY=test-router-key
          # Fake Hermes started by scripts/ui-e2e.mjs.
          export HERMES_BASE_URL=http://127.0.0.1:3299 HERMES_API_KEY=test-hermes-key HERMES_IMAGE_PROVIDER_ORDER=cloudflare,agnes,canva
          DATABASE_URL="$UI_DB" node apps/portal/scripts/migrate.mjs
          (cd apps/portal && DATABASE_URL="$UI_DB" npx next start -p 3200 > ../../ui-portal.log 2>&1) &
          for i in $(seq 1 60); do curl -fsS $APP_URL/api/health >/dev/null 2>&1 && break; sleep 1; done
          node scripts/ui-e2e.mjs || { tail -n 80 ui-portal.log; exit 1; }

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: .e2e-ui/screenshots
          if-no-files-found: ignore

      - name: Shell syntax
        run: bash -n apps/worker/install.sh && bash -n scripts/e2e.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/portal/Dockerfile -t venstudio-portal:ci .
      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: ci
          APP_URL: https://studio.example.com
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SETUP_TOKEN: abcdef
          DOMAIN: studio.example.com
        run: |
          docker network create coolify >/dev/null 2>&1 || true
          docker compose -f docker-compose.coolify.yml config -q
          docker compose -f deploy/docker-compose.yml config -q
      - name: Coolify stack starts and serves /setup
        env:
          POSTGRES_PASSWORD: cipassword
          APP_URL: https://studio.example.com
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SETUP_TOKEN: abcdef
        run: |
          cat > /tmp/ports.yml <<'YML'
          services:
            portal:
              ports: ["3000:3000"]
          YML
          docker network create coolify >/dev/null 2>&1 || true
          docker compose -f docker-compose.coolify.yml -f /tmp/ports.yml up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health || { docker compose -f docker-compose.coolify.yml logs --tail 60; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup)" = 200
          curl -fsS http://localhost:3000/install/SETUP.md | grep -q "https://studio.example.com/install/install.sh"
          # Another app on the shared coolify network (stands in for Hermes) must be reachable by container name.
          docker run -d --rm --name fake-hermes-abc --network coolify nginx:alpine >/dev/null
          sleep 2
          PORTAL=$(docker compose -f docker-compose.coolify.yml ps -q portal)
          docker exec "$PORTAL" node -e "fetch('http://fake-hermes-abc/').then(r=>{console.log('reach', r.status); process.exit(r.ok?0:1)}).catch(e=>{console.log('FAIL', e.cause?.code||e.message); process.exit(1)})"
          docker rm -f fake-hermes-abc >/dev/null
          docker compose -f docker-compose.coolify.yml logs portal | tail -20
          docker compose -f docker-compose.coolify.yml down -v
