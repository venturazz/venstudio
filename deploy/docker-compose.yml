# VenStudio on a single Linux server.
#   cp deploy/.env.example deploy/.env   # fill in values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Caddy gets a TLS certificate for $DOMAIN automatically. Only ports 80/443 are public;
# Postgres and the portal stay on the internal network.
name: venstudio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: venstudio
      POSTGRES_USER: venstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venstudio -d venstudio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://venstudio:${POSTGRES_PASSWORD}@db:5432/venstudio
      APP_URL: https://${DOMAIN:?set DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: "true"
      MAX_ARTIFACT_MB: ${MAX_ARTIFACT_MB:-2048}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
    volumes:
      - artifacts:/data/artifacts
    networks: [internal]
    # If 9router runs on this host outside Docker, reach it via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [portal]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  db:
  artifacts:
  caddy_data:
  caddy_config:

networks:
  internal:
