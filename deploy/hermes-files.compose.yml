# Optional overlay: publishes the files Hermes generates so the portal can download them.
#
# Hermes generates into its own container. The tool hands back an absolute *path*, which the portal cannot
# read, and a base64 blob is far too large for a model reply — asking for one makes the turn loop until it is
# cut. So the portal downloads from here instead, and Hermes only ever reports a file name.
#
# Use it on top of the base file:
#   docker compose -f deploy/docker-compose.yml -f deploy/hermes-files.compose.yml --env-file deploy/.env up -d
#
# HERMES_DATA_DIR is the host path of the Hermes container's /opt/data. It is mounted read-only.
name: venstudio

services:
  hermes-files:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${HERMES_DATA_DIR:?set HERMES_DATA_DIR to the host path of the Hermes data directory}:/srv:ro
      - ./hermes-files.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]