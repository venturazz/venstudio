# VenStudio media host: publishes the files Hermes generates, read-only.
#
# The Hermes data directory is mounted at /srv in this container, so
#   /opt/data/cache/generated/images/<name>  ->  http://hermes-files:8000/img/<name>
#   /opt/data/cache/tts/<name>               ->  http://hermes-files:8000/tts/<name>
#   /opt/data/cache/audio/<name>             ->  http://hermes-files:8000/audio/<name>
#
# SECURITY: never root this server at the cache directory itself. /opt/data/cache also holds canva_tokens/
# (live Canva OAuth credentials), scratch/ and other working state. Only the three generated-asset
# directories below are published, they are mounted read-only, and everything else is a 404.
server {
    listen 8000;
    server_name _;

    # The names are unguessable, but do not advertise them either way.
    autoindex off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /img/ {
        alias /srv/cache/generated/images/;
        types {
            image/png  png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    location /tts/ {
        alias /srv/cache/tts/;
        types {
            audio/wav  wav;
            audio/mpeg mp3;
            audio/ogg  ogg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    location /audio/ {
        alias /srv/cache/audio/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else, including /canva_tokens/ and the cache root.
    location / {
        return 404;
    }
}