# VenStudio for Coolify (Docker Compose build pack).
#
# In Coolify: Base Directory = /   Docker Compose Location = /docker-compose.coolify.yml
# Coolify's proxy (Traefik) provides the domain and HTTPS, so there is no Caddy and no published ports here.
# Fill these in under Environment Variables (all four are required; the portal logs which one is missing):
#   APP_URL            https://studio.yourdomain.com   (same domain as in Domains, without :3000)
#   POSTGRES_PASSWORD  openssl rand -hex 16
#   ENCRYPTION_KEY     openssl rand -base64 32          (44 characters; back it up)
#   SETUP_TOKEN        openssl rand -hex 16
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: venstudio
      POSTGRES_USER: venstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - venstudio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venstudio -d venstudio"]
      interval: 10s
      timeout: 5s
      retries: 10

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Public address of the portal, e.g. https://studio.yourdomain.com
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://venstudio:${POSTGRES_PASSWORD}@db:5432/venstudio
      # 32 random bytes, base64 (openssl rand -base64 32). Back this value up.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # One-time token for https://<domain>/setup (openssl rand -hex 16).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Traefik replaces X-Forwarded-For from untrusted clients, so the portal can trust it.
      TRUST_PROXY: "true"
      MAX_ARTIFACT_MB: ${MAX_ARTIFACT_MB:-2048}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      # Hermes Agent API (internal address only, e.g. http://hermes-<id>:8642). Never a public domain.
      HERMES_BASE_URL: ${HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY}
      # Kokoro TTS (OpenAI-compatible, e.g. http://kokoro:8880). Unset means narration is not configured.
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-}
      KOKORO_API_KEY: ${KOKORO_API_KEY:-}
      KOKORO_MODEL: ${KOKORO_MODEL:-}
      KOKORO_VOICE: ${KOKORO_VOICE:-}
      # hermes-capcut (default) or off: whether Hermes' CapCut workflow is the voice backup.
      TTS_BACKUP: ${TTS_BACKUP:-hermes-capcut}
      # Optional comma list of Hermes image_gen providers to prefer, e.g. cloudflare,qwen. A hint only.
      HERMES_IMAGE_PROVIDER_ORDER: ${HERMES_IMAGE_PROVIDER_ORDER:-}
      # 1 lets the studio create unverified Muse agent tasks. Leave 0 until they are tested.
      MUSE_AGENT_TASKS: ${MUSE_AGENT_TASKS:-0}
    volumes:
      - venstudio-artifacts:/data/artifacts
    networks:
      - default
      # Coolify's shared network: lets the portal reach other apps on this server (Hermes, 9router)
      # by container name, e.g. http://hermes-<id>:8642. Nothing on it is public unless given a domain.
      - coolify
    # Lets the portal reach 9router running on the same server outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  venstudio-db:
  venstudio-artifacts:

networks:
  coolify:
    # Created by Coolify on every server it manages.
    external: true
