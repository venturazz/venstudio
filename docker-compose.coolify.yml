# VenStudio for Coolify (Docker Compose build pack).
#
# In Coolify: Base Directory = /   Docker Compose Location = /docker-compose.coolify.yml
# Coolify's proxy (Traefik) provides the domain and HTTPS, so there is no Caddy and no published ports here.
# Passwords and keys below are generated by Coolify on first load (SERVICE_* variables) and kept between deploys.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: venstudio
      POSTGRES_USER: venstudio
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - venstudio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venstudio -d venstudio"]
      interval: 10s
      timeout: 5s
      retries: 10

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify routes the portal's domain to container port 3000 and fills this with https://<your domain>.
      SERVICE_URL_PORTAL_3000: /
      APP_URL: ${SERVICE_URL_PORTAL_3000}
      DATABASE_URL: postgres://venstudio:${SERVICE_PASSWORD_POSTGRES}@db:5432/venstudio
      # 32 random bytes, base64. Back this value up: losing it means re-enrolling two-factor.
      ENCRYPTION_KEY: ${SERVICE_REALBASE64_PORTAL}
      # One-time token for https://<domain>/setup. Read it under Environment Variables.
      SETUP_TOKEN: ${SERVICE_HEX_32_SETUP}
      # Traefik replaces X-Forwarded-For from untrusted clients, so the portal can trust it.
      TRUST_PROXY: "true"
      MAX_ARTIFACT_MB: ${MAX_ARTIFACT_MB:-2048}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
    volumes:
      - venstudio-artifacts:/data/artifacts
    # Lets the portal reach 9router running on the same server outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  venstudio-db:
  venstudio-artifacts:
